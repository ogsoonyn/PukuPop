# develop / main 向けの PR と develop への push のとき、型検査・単体テスト・ビルドを流す(E2E は流さない)。
# Player のライブラリも、ビルド・確かめ・npm pack・空のプロジェクトでの確かめまで流す(リリースは作らない。release-player.yml)。
# 埋め込み用の編集画面も同じく、ビルドから配布物の確かめまで流す(release-editor.yml)
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

# 同じブランチ(PR)の古い実行は止める
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Player のライブラリ(手書きの型定義と実装の食い違いは、上の typecheck が見る)
      - run: npm run build:player
      - run: npm run check:player
      - run: npm run pack:player
      - run: npm run check:player-pack
      # 埋め込み用の編集画面(リリースは作らない。release-editor.yml)。check:editor は、上でビルドした公開版(dist/)に
      # 埋め込みの口が入っていないことも見る
      - run: npm run build:editor
      - run: npm run check:editor
      - run: npm run pack:editor
      - run: npm run check:editor-pack
